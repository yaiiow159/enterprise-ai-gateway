server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ai-gateway
  threads:
    virtual:
      # 整個網關的請求處理都跑在虛擬執行緒上：LLM 呼叫幾乎全是 I/O 等待，
      # 阻塞式程式碼在這個模型下是正確且最直白的寫法
      enabled: true

gateway:
  # 等到第一個 token 的期限（含對沖與失敗切換）。長 prompt 的預填階段可能要數十秒
  attempt-timeout: 60s
  # 請求沒帶 max_tokens／max_completion_tokens 時的輸出上限（OpenAI SDK 預設不帶）
  default-max-tokens: 1024

  auth:
    # 預設開啟；開啟卻沒有任何 key 時拒絕啟動。本機開發可設 GATEWAY_AUTH_ENABLED=false，
    # 那時租戶改由 X-Tenant 標頭自報——正式環境不能這樣，否則租戶上限換個名字就能繞過
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    # 格式：租戶=key，多筆以逗號分隔。key 只能從環境變數注入
    api-keys: ${GATEWAY_API_KEYS:}

  routing:
    strategy: latency-aware
    unknown-provider-assumption: 500ms
    # 半開探測：降級中的 Provider 每隔這段時間拿到一次機會。
    # 沒有它的話，滾動窗口只解決了一半——恢復是可能的，但前提是「還會被選中」，
    # 而排到墊底的 Provider 永遠不會被選中，暫時故障就變成永久除名。
    probe-interval: 30s
    probe-failure-threshold: 0.5

  hedge:
    # deferred：只有主要 Provider 超過自己的 p95 TTFT 才補發備援。
    # 換成 immediate 會讓每個請求的成本乘上 max-attempts 倍。
    policy: deferred
    max-attempts: 2
    fallback-delay: 800ms

  budget:
    # 每日成本上限，最後一道防線。上面所有防護都可能被繞過
    # （新端點忘了設上限、對沖被改成無條件、上游調價），
    # 但一個真的會攔截的每日上限能把損失限制在一天之內。
    #
    enabled: true
    # memory 是單節點的帳；正式環境要用 redis，否則設定檔上的 $50
    # 在三個節點上就是 $150（與熔斷器狀態同理）
    backend: ${BUDGET_BACKEND:memory}
    redis-uri: ${BUDGET_REDIS_URI:redis://localhost:6380}
    daily-limit-usd: 50
    per-tenant-daily-limit-usd: 10

  rag:
    # 預設關閉：沒有索引的 RAG 只會讓每個請求多付一次嵌入費用然後檢索到空結果。
    # 開之前先建索引：node tools/rag-index.js --input docs/rag-sample-kb.jsonl
    enabled: ${RAG_ENABLED:false}
    collection: ${RAG_COLLECTION:docs}
    # 呼叫端只能檢索 collection 與這裡列出的；每一個都會在啟動時檢查嵌入一致性
    extra-collections: []
    # 索引與查詢必須是同一個模型。啟動時會拿這兩個值跟 collection 實際記錄的比對，
    # 不符就拒絕啟動——維度相同但模型不同的話不會報錯，只是檢索結果全部不相關
    embedding-model: ${RAG_EMBEDDING_MODEL:fake-embed-v1}
    embedding-dimension: ${RAG_EMBEDDING_DIM:32}
    embedding-base-url: ${RAG_EMBEDDING_URL:http://localhost:9101}
    vector-store-url: ${RAG_VECTOR_STORE_URL:http://localhost:6333}
    fail-on-mismatch: true

  providers:
    # 本機開發預設指向假 Provider（見 tools/fake-provider）。
    # 金鑰一律只從環境變數注入，設定檔不得出現任何金鑰字面值。
    #
    # served-models 是呼叫端在請求裡寫的模型名稱。同一個名稱底下的 Provider
    # 必須是同一個模型的等價部署：對沖與失敗切換只在同一組內進行。
    # 三個假 Provider 模擬的就是同一個模型的三個來源，所以共用 fake-chat。
    #
    # stream-idle-timeout：串流開始後兩個 chunk 之間最長可以等多久（預設 30s）。
    # 上游卡住時沒有它，轉發會永遠阻塞，客戶端離開也偵測不到。
    #
    # supports-tools／supports-vision（預設 false）：帶 tools 或圖片的請求只會路由到宣告支援的 Provider。
    # stream-usage（預設 true）：串流時要求上游回報用量；只有上游不認得 stream_options 時才關掉。
    - name: fake-fast
      base-url: ${FAKE_FAST_URL:http://localhost:9101}
      model: fake-fast
      served-models: [fake-chat]
      context-window-tokens: 128000
      max-output-tokens: 4096
      input-micro-cents-per-token: 50
      output-micro-cents-per-token: 150

    - name: fake-slow
      base-url: ${FAKE_SLOW_URL:http://localhost:9102}
      model: fake-slow
      served-models: [fake-chat]
      context-window-tokens: 128000
      max-output-tokens: 4096
      input-micro-cents-per-token: 20
      output-micro-cents-per-token: 60

    - name: fake-flaky
      base-url: ${FAKE_FLAKY_URL:http://localhost:9103}
      model: fake-flaky
      served-models: [fake-chat]
      context-window-tokens: 128000
      max-output-tokens: 4096
      input-micro-cents-per-token: 10
      output-micro-cents-per-token: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ai-gateway

logging:
  level:
    io.aigateway: INFO
